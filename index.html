  <title>Hermes Gmail & Calendar Automation</title>
  <style>
    :root{color-scheme:light dark;--bg:#0f172a;--card:#18233b;--text:#eef4ff;--muted:#b9c6dc;--accent:#8ab4f8}*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic UI",sans-serif;background:linear-gradient(145deg,#0b1020,var(--bg));color:var(--text);line-height:1.75}.wrap{width:min(760px,calc(100% - 40px));margin:0 auto;padding:72px 0}.badge{display:inline-block;padding:5px 12px;border:1px solid #455a7c;border-radius:999px;color:var(--accent);font-size:14px}h1{font-size:clamp(32px,7vw,52px);line-height:1.15;margin:22px 0}p{color:var(--muted)}.card{margin-top:36px;padding:28px;border:1px solid #31415f;border-radius:18px;background:rgba(24,35,59,.82)}h2{margin-top:0;font-size:22px}a{color:var(--accent)}footer{margin-top:48px;color:#8fa0bb;font-size:14px}@media(prefers-color-scheme:light){:root{--bg:#eef4ff;--card:#fff;--text:#162033;--muted:#4c5a70;--accent:#2459b8}body{background:linear-gradient(145deg,#f8fbff,var(--bg))}.card{border-color:#cad6e7;background:rgba(255,255,255,.9)}}

<body>
  <main class="wrap">
    <span class="badge">個人利用の自動化ツール</span>
    <h1>Hermes Gmail &amp; Calendar Automation</h1>
    <p>GmailとGoogleカレンダーの情報を、アカウント所有者本人の依頼に基づいて整理・要約するための個人用自動化ツールです。</p>
    <section class="card">
      <h2>提供する機能</h2>
      <p>メールの分類・確認、予定情報の取得、経費関連メールの整理など、日々の情報管理を補助します。取得した情報を広告目的で利用したり、第三者へ販売したりすることはありません。</p>
    </section>
    <section class="card">
      <h2>プライバシー</h2>
      <p>Googleアカウントのデータの取り扱いについては、<a href="privacy.html">プライバシーポリシー</a>をご確認ください。</p>
    </section>
    <footer>運営者: naganosyotaro / 最終更新: 2026-09-30</footer>
